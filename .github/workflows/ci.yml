name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test · deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, tokenizer, xml, ctype, json, bcmath
          coverage: none

      - name: Install Composer deps
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Tests
        run: php artisan test
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          SESSION_DRIVER: array
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array

      # Engine Coolify app uuid (different from SPA). Needs Bearer API token.
      - name: Deploy (Coolify)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$COOLIFY_DEPLOY_WEBHOOK" ]; then
            echo "COOLIFY_DEPLOY_WEBHOOK secret is missing (engine app deploy URL with uuid)"
            exit 1
          fi
          if [ -z "$COOLIFY_API_TOKEN" ]; then
            echo "COOLIFY_API_TOKEN secret is missing — Coolify → Keys & Tokens"
            exit 1
          fi
          curl --fail --show-error --silent \
            --request GET \
            --header "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            --header "Accept: application/json" \
            "$COOLIFY_DEPLOY_WEBHOOK"
          echo "Coolify engine deploy triggered"
